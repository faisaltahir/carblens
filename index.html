// Dynamically load an external script once.
function loadScript(src) {
  return new Promise((resolve, reject) => {
    if (document.querySelector(`script[src="${src}"]`)) return resolve()
    const s = document.createElement('script')
    s.src = src
    s.onload = () => resolve()
    s.onerror = () => reject(new Error('Failed to load ' + src))
    document.head.appendChild(s)
  })
}

// Find (or create) a dedicated "CarbLens Backups" folder and return its id.
// With the drive.file scope we only ever see folders/files this app created,
// so this reliably reuses the same folder across uploads. Returns null on
// failure, in which case the upload falls back to My Drive root.
const DRIVE_FOLDER = 'CarbLens Backups'
async function ensureDriveFolder(token) {
  try {
    const q = encodeURIComponent(`name='${DRIVE_FOLDER}' and mimeType='application/vnd.google-apps.folder' and trashed=false`)
    const sr = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&spaces=drive&fields=files(id,name)`, {
      headers: { Authorization: 'Bearer ' + token }
    })
    if (sr.ok) {
      const sd = await sr.json()
      if (sd.files && sd.files.length) return sd.files[0].id
    }
    const cr = await fetch('https://www.googleapis.com/drive/v3/files', {
      method: 'POST',
      headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: DRIVE_FOLDER, mimeType: 'application/vnd.google-apps.folder' })
    })
    if (cr.ok) { const cd = await cr.json(); return cd.id }
  } catch (e) { console.error('CarbLens: Drive folder setup failed', e) }
  return null
}

// Upload the JSON backup straight to the user's Google Drive.
// Uses Google Identity Services for OAuth (scope drive.file = only files this
// app creates). Requires a Google OAuth Client ID configured in Settings, and
// the app's origin added to that client's Authorised JavaScript origins.
async function uploadToDrive() {
  const clientId = (localStorage.getItem('cl_google_client_id') || '').trim()
  if (!clientId) { notify('Add a Google OAuth Client ID in Settings to enable Drive upload.', 'err'); return }
  const btn = document.getElementById('driveBtn')
  const orig = btn ? btn.textContent : ''
  if (btn) { btn.disabled = true; btn.textContent = '⟳ Connecting…' }
  try {
    await loadScript('https://accounts.google.com/gsi/client')
    if (!window.google || !google.accounts || !google.accounts.oauth2) {
      throw new Error('Google sign-in failed to load.')
    }
    const token = await new Promise((resolve, reject) => {
      const client = google.accounts.oauth2.initTokenClient({
        client_id: clientId,
        scope: 'https://www.googleapis.com/auth/drive.file',
        callback: (resp) => resp && resp.access_token ? resolve(resp.access_token) : reject(new Error(resp && resp.error ? resp.error : 'Authorisation cancelled'))
      })
      client.requestAccessToken()
    })
    const json = JSON.stringify(buildExport(), null, 2)
    const folderId = await ensureDriveFolder(token)
    const boundary = 'carblens' + Date.now()
    const metadata = { name: backupFilename(), mimeType: 'application/json', parents: folderId ? [folderId] : undefined }
    const body =
      `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n` +
      `--${boundary}\r\nContent-Type: application/json\r\n\r\n${json}\r\n--${boundary}--`
    const r = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
      method: 'POST',
      headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'multipart/related; boundary=' + boundary },
      body
    })
    if (!r.ok) { const t = await r.text().catch(() => ''); throw new Error('Drive upload failed (' + r.status + '). ' + t.slice(0, 120)) }
    notify(folderId ? 'Backup uploaded to Drive → CarbLens Backups ✓' : 'Backup uploaded to Google Drive ✓', 'ok')
  } catch (e) {
    console.error('CarbLens: Drive upload failed', e)
    notify('Drive upload failed: ' + (e.message || e), 'err')
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = orig }
  }
}

function saveGoogleClientId() {
  const inp = document.getElementById('googleClientIdInput')
  if (!inp) return
  const v = inp.value.trim()
  if (v) localStorage.setItem('cl_google_client_id', v)
  else localStorage.removeItem('cl_google_client_id')
  const btn = document.getElementById('saveGoogleIdBtn')
  if (btn) { btn.textContent = '✓ Saved'; setTimeout(() => { btn.textContent = 'Save'; render() }, 1500) }
}

// ── RENDER ────────────────────────────────────────────────────
function render() {
  const m = document.getElementById('main')
  if (state.page === 'log') m.innerHTML = renderLog()
  else if (state.page === 'history') m.innerHTML = renderHistory()
  else if (state.page === 'stats') m.innerHTML = renderStats()
  else m.innerHTML = renderSettings()
  attachEvents()
}

// ── LOG PAGE ──────────────────────────────────────────────────
function renderLog() {
  const L = state.log
  if (L.phase === 'input') return renderInput()
  if (L.phase === 'clarifying') return renderClarify()
  if (L.phase === 'result') return renderResult()
  return ''
}

  return `

    ${hasImage ? `<div class="result-img"><img src="data:${L.imageMime};base64,${L.imageB64}" alt="Your meal"></div>` : ''}

        ${L.refineError ? `<div class="err-box">${L.refineError}</div>` : ''}
        <div class="row" style="gap:8px">
          <button class="btn-sec" onclick="closeRefine()">Cancel</button>
          <button class="btn-main" style="flex:1" id="refineBtn" onclick="submitRefine()" ${L.refining ? 'disabled' : ''}>
            ${L.refining ? '<span class="dots">Re-analysing<span>.</span><span>.</span><span>.</span></span>' : 'Re-analyse →'}
          </button>
        </div>
      </div>` : `
      <button class="refine-trigger" onclick="openRefine()">

// ── HISTORY ───────────────────────────────────────────────────
function renderHistory() {
  if (!state.meals.length) return `<div class="pg"><div class="empty"><span class="empty-ico">◷</span><h2>No meals logged yet</h2><p>Your meal history will appear here</p></div></div>`

  const isGrid = state.historyView === 'grid'
  // Pagination: only render the most recent N meals to keep the DOM light
  if (!state.historyLimit) state.historyLimit = 30
  const visibleMeals = state.meals.slice(0, state.historyLimit)
  const hasMore = state.meals.length > state.historyLimit
  const grouped = {}
  visibleMeals.forEach(m => {
    const d = new Date(m.timestamp).toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' })
    if (!grouped[d]) grouped[d] = []
    grouped[d].push(m)
  })

  if (isGrid) {
    // Photo grid — paginated like the list to keep the DOM light
    if (!state.gridLimit) state.gridLimit = 30
    const allPhotos = state.meals.filter(m => m.imageB64)
    const withPhotos = allPhotos.slice(0, state.gridLimit)
    const gridHasMore = allPhotos.length > state.gridLimit
    return `<div class="pg">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
        <div class="pg-title" style="margin-bottom:0">Food Diary</div>
        <button class="view-toggle" onclick="state.historyView='list';render()">☰ List</button>
      </div>
      ${withPhotos.length === 0
        ? `<div style="text-align:center;padding:40px 20px;color:var(--muted);font-family:var(--mono);font-size:13px">No photos logged yet.<br>Take a photo when logging a meal to build your food diary.</div>`
        : `<div class="photo-grid">
            ${withPhotos.map(m => `
            <div class="pg-cell" onclick="state.historyView='list';state.meals.forEach(x=>x._expanded=false);toggleHistoryAndSwitch('${m.id}')">
              <img src="data:${m.imageMime||'image/jpeg'};base64,${m.imageB64}" loading="lazy">
              <div class="pg-overlay">
                <span class="pg-carbs">${m.nutrition.carbs}g</span>
                <span class="pg-dose">${m.dose.total}u${m.dose.split?'⚡':''}</span>
              </div>
            </div>`).join('')}
          </div>
          ${gridHasMore ? `
          <button class="btn-sec" style="width:100%;margin-top:10px" onclick="state.gridLimit += 30; render()">
            Load more photos (${allPhotos.length - state.gridLimit} remaining)
          </button>` : ''}`}
    </div>`
  }

  return `<div class="pg">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
      <div class="pg-title" style="margin-bottom:0">Meal History</div>
      <button class="view-toggle" onclick="state.historyView='grid';render()">⊞ Photos</button>
    </div>
    ${Object.entries(grouped).map(([date, meals]) => `
    <div class="day-grp">
      <div class="day-lbl">${date}</div>
      ${meals.map(m => renderHistoryCard(m)).join('')}
    </div>`).join('')}
    ${hasMore ? `
    <button class="btn-sec" style="width:100%;margin-top:4px" onclick="state.historyLimit += 30; render()">
      Load more (${state.meals.length - state.historyLimit} older meals)
    </button>` : ''}
  </div>`
}

function toggleHistoryAndSwitch(id) {
  const meal = state.meals.find(m => m.id === id)
  if (meal) { meal._expanded = true; render() }
}

// Open the referenced meal in History (expanded).
function openLastMeal(id) {
  const m = state.meals.find(x => x.id === id)
  if (m) m._expanded = true
  nav('history')
}

function renderHistoryCard(m) {
  const isExp = m._expanded
  const n = m.nutrition
  const d = m.dose
  const sid = m.id.replace(/-/g,'').substring(0,8) // short safe id for input ids

  // Which glucose inputs to show
  const showPreInput = isExp && !m.preGlucose && m._editingPre
  const showPostInput = isExp && !m.postGlucose && m._editingPost

  return `
  <div class="hcard ${isExp ? 'exp' : ''}">
    <div class="hcard-hdr" onclick="toggleHistory('${m.id}')">
      <div class="hcard-l">
        ${m.imageB64 ? `<img class="h-thumb" src="data:${m.imageMime||'image/jpeg'};base64,${m.imageB64}" alt="" loading="lazy">` : ''}
        <div class="h-info">
          <span class="h-name">${escapeHTML(m.description || n.mealDescription)}</span>
          <span class="h-time">${new Date(m.timestamp).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}</span>
        </div>
      </div>
      <div class="hcard-r">
        <span class="h-carbs">${n.carbs}g</span>
        <span class="h-dose ${d.split ? 'sp' : ''}">${d.total}u ${d.split ? '⚡' : ''}</span>
      </div>
    </div>
    ${isExp ? `
    <div class="hcard-body">
      ${m.imageB64 ? `<div class="h-full-img"><img src="data:${m.imageMime||'image/jpeg'};base64,${m.imageB64}" alt="" loading="lazy"></div>` : ''}

      <div class="h-nut-row">
        ${[['Cal',n.calories,'kcal'],['Carbs',n.carbs,'g'],['Protein',n.protein,'g'],['Fat',n.fat,'g'],['Fiber',n.fiber,'g'],['Sugar',n.sugar,'g']].map(([lb,v,u])=>`
        <div class="hnut"><span class="hnut-v">${v}<span style="font-size:9px;color:var(--dim)">${u}</span></span><span class="hnut-l">${lb}</span></div>`).join('')}
      </div>

      ${d.split ? `<div class="h-split-note">⚡ Split: ${d.now}u now + ${d.later}u after ${d.delay}min</div>` : ''}

      <!-- GLUCOSE SECTION -->
      <div class="h-gluco-card">
        <div class="h-gluco-title">🩸 Glucose</div>

        <!-- Pre-meal -->
        <div class="h-gluco-row">
          <span class="h-gluco-lbl">Pre-meal</span>
          ${m.preGlucose
            ? `<div class="h-gluco-val-row">
                <span class="h-gluco-val">${m.preGlucose.value} <span class="h-gluco-unit">mg/dL</span></span>
                <button class="h-gluco-edit" onclick="event.stopPropagation();clearHistoryGluco('${m.id}','pre')">✕</button>
               </div>`
            : showPreInput
              ? `<div class="h-gluco-input-row" onclick="event.stopPropagation()">
                  <input class="h-gluco-inp" id="pre_${sid}" type="number" min="40" max="600" placeholder="mg/dL" autofocus>
                  <button class="h-gluco-save" onclick="event.stopPropagation();saveHistoryGluco('${m.id}','pre','pre_${sid}')">Save</button>
                  <button class="h-gluco-cancel" onclick="event.stopPropagation();cancelHistoryGluco('${m.id}','pre')">✕</button>
                 </div>`
              : `<button class="h-gluco-add" onclick="event.stopPropagation();editHistoryGluco('${m.id}','pre')">+ Add</button>`
          }
        </div>

        <!-- Post-meal -->
        <div class="h-gluco-row">
          <span class="h-gluco-lbl">Post-meal</span>
          ${m.postGlucose
            ? `<div class="h-gluco-val-row">
                <span class="h-gluco-val">${m.postGlucose.value} <span class="h-gluco-unit">mg/dL</span></span>
                <button class="h-gluco-edit" onclick="event.stopPropagation();clearHistoryGluco('${m.id}','post')">✕</button>
               </div>`
            : showPostInput
              ? `<div class="h-gluco-input-row" onclick="event.stopPropagation()">
                  <input class="h-gluco-inp" id="post_${sid}" type="number" min="40" max="600" placeholder="mg/dL" autofocus>
                  <button class="h-gluco-save" onclick="event.stopPropagation();saveHistoryGluco('${m.id}','post','post_${sid}')">Save</button>
                  <button class="h-gluco-cancel" onclick="event.stopPropagation();cancelHistoryGluco('${m.id}','post')">✕</button>
                 </div>`
              : `<button class="h-gluco-add" onclick="event.stopPropagation();editHistoryGluco('${m.id}','post')">+ Add</button>`
          }
        </div>

        <!-- Effective ICR -->
        ${m.effectiveICR ? `
        <div class="h-gluco-row">
          <span class="h-gluco-lbl">Effective ICR</span>
          <span class="h-gluco-val accent">1:${m.effectiveICR}</span>
        </div>` : ''}

        <!-- Rise/drop indicator -->
        ${(m.preGlucose && m.postGlucose) ? (() => {
          const delta = m.postGlucose.value - m.preGlucose.value
          const post = m.postGlucose.value
          let cls, label, arrow
          if (post < 70) {
            cls = 'bad'; arrow = '⚠'
            label = `Post-meal low (${post} mg/dL) — possible hypo`
          } else if (delta < -30) {
            cls = 'warn'; arrow = '↓'
            label = `${Math.abs(delta)} mg/dL drop — watch for lows`
          } else if (delta > 60) {
            cls = 'bad'; arrow = '↑'
            label = `${delta} mg/dL rise — higher than expected`
          } else if (delta > 30) {
            cls = 'warn'; arrow = '↑'
            label = `${delta} mg/dL rise — moderate`
          } else {
            cls = 'good'; arrow = delta >= 0 ? '↑' : '↓'
            label = `${delta >= 0 ? '+' : ''}${delta} mg/dL — well controlled`
          }
          return `<div class="h-rise ${cls}">${arrow} ${label}</div>`
        })() : ''}
      </div>

      ${n.notes && n.notes.length ? `<div class="h-notes"><ul>${n.notes.map(nt=>`<li>${escapeHTML(nt)}</li>`).join('')}</ul></div>` : ''}
    </div>` : ''}
  </div>`
}

// ── STATS ─────────────────────────────────────────────────────
function renderStats() {
  const meals = state.meals
  if (!meals.length) return `<div class="pg"><div class="empty"><span class="empty-ico">◈</span><h2>No data yet</h2><p>Log some meals to see your stats</p></div></div>`

  // ── Core helpers ──
  const avg = arr => arr.length ? Math.round(arr.reduce((a,b)=>a+b,0)/arr.length * 10) / 10 : 0
  const r1 = n => Math.round(n * 10) / 10

  // ── Date ranges ──
  const now = new Date()
  const d7 = new Date(now); d7.setDate(d7.getDate()-7)
  const d30 = new Date(now); d30.setDate(d30.getDate()-30)
  const recent7 = meals.filter(m => new Date(m.timestamp) > d7)
  const recent30 = meals.filter(m => new Date(m.timestamp) > d30)

  // ── Nutrition averages ──
  const avgCarbs = avg(meals.map(m => m.nutrition.carbs))
  const avgCal   = avg(meals.map(m => m.nutrition.calories))
  const avgDose  = avg(meals.map(m => m.dose.total))
  const avgProt  = avg(meals.map(m => m.nutrition.protein))
  const avgFat   = avg(meals.map(m => m.nutrition.fat))
  const avgFiber = avg(meals.map(m => m.nutrition.fiber))
  const splits   = meals.filter(m => m.dose.split).length
  const splitPct = Math.round(splits / meals.length * 100)

  // ── Glucose data ──
  const withBoth = meals.filter(m => m.preGlucose && m.postGlucose)
  const avgPre   = avg(withBoth.map(m => m.preGlucose.value))
  const avgPost  = avg(withBoth.map(m => m.postGlucose.value))
  const avgRise  = avg(withBoth.map(m => m.postGlucose.value - m.preGlucose.value))
  // Well controlled = stayed in a good band: no big rise, no big drop, no hypo
  const wellCtrl = withBoth.filter(m => {
    const delta = m.postGlucose.value - m.preGlucose.value
    return delta <= 30 && delta >= -30 && m.postGlucose.value >= 70
  }).length
  const wellPct  = withBoth.length ? Math.round(wellCtrl / withBoth.length * 100) : 0
  const lowCount = withBoth.filter(m => m.postGlucose.value < 70).length

  // ── TIME-OF-DAY ICR ──
  const todBuckets = { Breakfast: [5,11], Lunch: [11,16], Dinner: [16,22], Night: [22,5] }
  const todRows = Object.entries(todBuckets).map(([name, [a,b]]) => {
    const inBucket = meals.filter(m => {
      const h = new Date(m.timestamp).getHours()
      return a < b ? (h >= a && h < b) : (h >= a || h < b)
    }).filter(m => m.dose.total > 0 && m.nutrition.carbs > 0)
    if (inBucket.length < 3) return { name, icr: null, n: inBucket.length }
    // Effective ICR per meal: carbs/dose, glucose-adjusted where both readings exist
    const effs = inBucket.map(m => {
      let carbsPerUnit = m.nutrition.carbs / m.dose.total
      if (m.preGlucose && m.postGlucose) {
        const delta = m.postGlucose.value - m.preGlucose.value
        const isf = clampNum(state.settings.isf, 5, 300, 40)
        const missedUnits = delta / isf  // + = under-dosed, − = over-dosed
        const impliedDose = m.dose.total + missedUnits
        if (impliedDose > 0.5) carbsPerUnit = m.nutrition.carbs / impliedDose
      }
      return carbsPerUnit
    })
    const avg = effs.reduce((x,y)=>x+y,0) / effs.length
    return { name, icr: Math.round(avg * 10) / 10, n: inBucket.length }
  })
  const todSetICR = clampNum(state.settings.icr, 1, 30, 6)

  // ── PROBLEM FOODS ──
  const foodGroups = {}
  withBoth.forEach(m => {
    const words = (m.description || m.nutrition.mealDescription || '').toLowerCase()
      .replace(/[^a-z ]/g,' ').split(/\s+/).filter(w => w.length > 3)
    const key = words.slice(0, 2).join(' ')
    if (!key) return
    if (!foodGroups[key]) foodGroups[key] = { name: key, total: 0, spikes: 0, lows: 0 }
    const g = foodGroups[key]
    g.total++
    const delta = m.postGlucose.value - m.preGlucose.value
    if (delta > 60) g.spikes++
    if (m.postGlucose.value < 70) g.lows++
  })
  const problemFoods = Object.values(foodGroups)
    .filter(g => g.total >= 2 && (g.spikes + g.lows) / g.total >= 0.5 && (g.spikes + g.lows) >= 2)
    .sort((a,b) => (b.spikes + b.lows) - (a.spikes + a.lows))
    .slice(0, 5)

  // ── DATA-DRIVEN ICR CALCULATION ──
  // Method 1: from effectiveICR fields (pre+post glucose recorded)
  const effICRs = meals.filter(m => m.effectiveICR && m.effectiveICR > 0).map(m => m.effectiveICR)
  const avgEffICR = effICRs.length ? r1(avg(effICRs)) : null

  // Method 2: direct carbs/dose ratio (doesn't require glucose, just meal data)
  // This is the raw ICR implied by how much insulin was taken per gram of carbs
  const carbDoseRatios = meals.filter(m => m.dose.total > 0 && m.nutrition.carbs > 0)
                              .map(m => m.nutrition.carbs / m.dose.total)
  const impliedICR = carbDoseRatios.length ? r1(avg(carbDoseRatios)) : null

  // Use effectiveICR if available (more accurate), else fall back to implied
  const dataICR = avgEffICR || impliedICR
  const dataICRMethod = avgEffICR ? 'glucose-adjusted' : (impliedICR ? 'dose-implied' : null)
  const dataICRN = avgEffICR ? effICRs.length : carbDoseRatios.length
  const confidence = dataICRN >= 10 ? 'high' : dataICRN >= 5 ? 'medium' : dataICRN >= 2 ? 'low' : null
  const confPct = dataICRN >= 10 ? 95 : dataICRN >= 5 ? 65 : dataICRN >= 2 ? 35 : 10

  const setICR = state.settings.icr
  const icrDiff = dataICR ? r1(dataICR - setICR) : null
  const icrVerdict = !dataICR ? 'nodata'
    : Math.abs(icrDiff) <= 0.5 ? 'match'
    : icrDiff > 0 ? 'low'   // data ICR higher → your current dose may be too high (too much insulin per carb)
    : 'high'                 // data ICR lower  → current dose may be too little

  const verdictIcon = { match:'✓', low:'↑', high:'↓', nodata:'?' }[icrVerdict]
  const verdictTitle = {
    match: 'Your ICR looks well calibrated',
    low:   'Data suggests your ICR may be too aggressive',
    high:  'Data suggests your ICR may be too conservative',
    nodata:'Not enough data yet'
  }[icrVerdict]
  const verdictSub = {
    match: `1:${dataICR} measured vs 1:${setICR} set — within tolerance`,
    low:   `Measured 1:${dataICR} vs set 1:${setICR} — you may need fewer units per meal`,
    high:  `Measured 1:${dataICR} vs set 1:${setICR} — you may need more units per meal`,
    nodata: 'Log more meals with glucose readings to get a personalised ICR recommendation'
  }[icrVerdict]
  const verdictDetail = {
    match: `Based on ${dataICRN} meal${dataICRN!==1?'s':''} (${dataICRMethod}), your insulin dosing aligns with your set ratio. Continue monitoring.`,
    low:   `Your data-derived ratio is ${Math.abs(icrDiff).toFixed(1)} higher than your setting. If this persists across ${dataICRN} meals, consider adjusting upward. Always confirm with your diabetes care team before changing your ratio.`,
    high:  `Your data-derived ratio is ${Math.abs(icrDiff).toFixed(1)} lower than your setting. Post-meal glucose may be running higher than expected. Discuss with your care team.`,
    nodata: 'Add pre- and post-meal glucose readings to your history cards to unlock personalised ICR analysis.'
  }[icrVerdict]

  // ── Mini sparkline data (last 14 meals, carbs) ──
  const spark = meals.slice(0, 14).reverse()
  const sparkMax = Math.max(...spark.map(m => m.nutrition.carbs), 1)
  const sparkW = 100 / Math.max(spark.length, 1)
  const sparkPoints = spark.map((m, i) => {
    const x = i * sparkW + sparkW/2
    const y = 44 - (m.nutrition.carbs / sparkMax) * 38
    return `${x},${y}`
  }).join(' ')


  // ── GI distribution ──
  const giD = {
    low:    meals.filter(m => m.nutrition.glycemicIndex === 'low').length,
    medium: meals.filter(m => m.nutrition.glycemicIndex === 'medium').length,
    high:   meals.filter(m => m.nutrition.glycemicIndex === 'high').length,
  }
  const maxGI = Math.max(giD.low, giD.medium, giD.high, 1)

  // ── Highest carb meal ──
  const highCarbMeal = meals.reduce((a,b) => b.nutrition.carbs > a.nutrition.carbs ? b : a, meals[0])

  return `<div class="stats-pg">

    <!-- HEADER -->
    <div class="stats-hero">
      <div style="display:flex;align-items:center;justify-content:space-between">
        <div>
          <div class="stats-hero-title">Stats</div>
          <div class="stats-hero-sub">${meals.length} meals logged · ${recent7.length} this week · ${recent30.length} this month</div>
        </div>
        <button class="narrative-btn" onclick="generateNarrative()" ${state.narrative.loading ? 'disabled' : ''}>
          ${state.narrative.loading ? '<span class="spin">⟳</span>' : '✦ Insights'}
        </button>
      </div>
    </div>

    <!-- AI NARRATIVE -->
    ${state.narrative.text ? `
    <div class="narrative-card">
      <div class="narrative-hdr">
        <span>✦</span>
        <span>AI Pattern Analysis</span>
        <button class="narrative-close" onclick="state.narrative.text=null;save();render()">✕</button>
      </div>
      <div class="narrative-body">${escapeHTML(state.narrative.text)}</div>
      <div class="narrative-ts">Generated ${new Date(state.narrative.generatedAt).toLocaleDateString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</div>
    </div>` : ''}

    <!-- ICR VERDICT — top of page, most important -->
    <div class="icr-verdict ${icrVerdict}">
      <div class="iv-header">
        <span class="iv-icon">${verdictIcon}</span>
        <div>
          <div class="iv-title">${verdictTitle}</div>
          <div class="iv-sub">${verdictSub}</div>
        </div>
      </div>
      <div class="iv-numbers">
        <div class="iv-num">
          <span class="iv-val" style="color:var(--accent)">1:${setICR}</span>
          <span class="iv-lbl">Set ICR</span>
        </div>
        <div class="iv-num">
          <span class="iv-val" style="color:${icrVerdict==='match'?'var(--accent)':icrVerdict==='nodata'?'var(--dim)':'var(--warn)'}">${dataICR ? '1:'+dataICR : '—'}</span>
          <span class="iv-lbl">Data ICR</span>
        </div>
        <div class="iv-num">
          <span class="iv-val" style="color:${icrDiff===null?'var(--dim)':Math.abs(icrDiff)<=0.5?'var(--accent)':'var(--warn)'}">${icrDiff !== null ? (icrDiff > 0 ? '+' : '') + icrDiff : '—'}</span>
          <span class="iv-lbl">Difference</span>
        </div>
      </div>
      ${confidence ? `
      <div class="iv-confidence">
        <span class="iv-conf-lbl">Confidence</span>
        <div class="iv-conf-bar"><div class="iv-conf-fill" style="width:${confPct}%"></div></div>
        <span class="iv-conf-lbl">${confidence} (${dataICRN} meals)</span>
      </div>` : ''}
      <div class="iv-verdict-text">${verdictDetail}</div>
    </div>

    <!-- TIME-OF-DAY ICR -->
    ${todRows.some(r => r.icr) ? `
    <div class="tod-card">
      <div class="tod-hdr">◔ ICR by time of day</div>
      ${todRows.map(r => {
        const dev = r.icr ? Math.round((r.icr - todSetICR) * 10) / 10 : null
        const flag = dev !== null && Math.abs(dev) / todSetICR > 0.15
        return `
        <div class="tod-row">
          <span class="tod-name">${r.name}</span>
          <span class="tod-icr" style="color:${!r.icr ? 'var(--dim)' : flag ? 'var(--warn)' : 'var(--accent)'}">${r.icr ? '1:' + r.icr : '—'}</span>
          <span class="tod-note">${!r.icr ? (r.n ? r.n + ' meals (need 3+)' : 'no data') : flag ? (dev < 0 ? 'runs stronger than set' : 'runs weaker than set') : 'matches set ICR'}</span>
        </div>`
      }).join('')}
      <div class="tod-foot">Set ICR 1:${todSetICR} · glucose-adjusted where readings exist. Discuss shifts with your care team.</div>
    </div>` : ''}

    <!-- PROBLEM FOODS -->
    ${problemFoods.length ? `
    <div class="pf-card">
      <div class="tod-hdr">⚠ Foods to watch</div>
      ${problemFoods.map(g => `
      <div class="pf-row">
        <span class="pf-name">${escapeHTML(g.name)}</span>
        <span class="pf-stat">${g.spikes ? g.spikes + '× spiked' : ''}${g.spikes && g.lows ? ' · ' : ''}${g.lows ? g.lows + '× went low' : ''} <span class="pf-of">of ${g.total}</span></span>
      </div>`).join('')}
    </div>` : ''}

    <!-- SUMMARY ROW -->
    <div class="stats-section" style="margin-top:18px">
      <div class="sec-ttl">Overview</div>
      <div class="summary-row">
        <div class="sum-cell"><span class="sum-v" style="color:var(--accent)">${meals.length}</span><span class="sum-l">Total meals</span></div>
        <div class="sum-cell"><span class="sum-v" style="color:var(--split)">${splits}</span><span class="sum-l">Split doses</span></div>
        <div class="sum-cell"><span class="sum-v" style="color:${wellPct>=70?'var(--accent)':wellPct>=50?'var(--warn)':'var(--danger)'}">${withBoth.length ? wellPct+'%' : '—'}</span><span class="sum-l">Well controlled</span></div>
      </div>
    </div>

    <!-- NUTRITION AVERAGES -->
    <div class="stats-section" style="margin-top:18px">
      <div class="sec-ttl">Nutrition averages</div>
      <div class="stat-grid">
        <div class="stat-card nm-carb">
          <span class="stat-v">${avgCarbs}g</span>
          <span class="stat-l">Avg carbs / meal</span>
          <span class="stat-sub">Implies ~${r1(avgCarbs/setICR)}u insulin</span>
        </div>
        <div class="stat-card hi">
          <span class="stat-v">${avgDose}u</span>
          <span class="stat-l">Avg insulin dose</span>
          <span class="stat-sub">Actual bolus given</span>
        </div>
        <div class="stat-card nm-cal">
          <span class="stat-v">${avgCal}</span>
          <span class="stat-l">Avg calories</span>
        </div>
        <div class="stat-card nm-pro">
          <span class="stat-v">${avgProt}g</span>
          <span class="stat-l">Avg protein</span>
        </div>
        <div class="stat-card nm-fat">
          <span class="stat-v">${avgFat}g</span>
          <span class="stat-l">Avg fat</span>
        </div>
        <div class="stat-card nm-fib">
          <span class="stat-v">${avgFiber}g</span>
          <span class="stat-l">Avg fiber</span>
        </div>
        <div class="stat-card wide">
          <span class="stat-l" style="margin-bottom:4px">Carb trend — last ${spark.length} meals</span>
          <div class="trend-chart">
            <svg class="trend-svg" viewBox="0 0 100 48" preserveAspectRatio="none">
              <polyline points="${sparkPoints}" fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
              ${spark.map((m,i) => `<circle cx="${i * sparkW + sparkW/2}" cy="${44-(m.nutrition.carbs/sparkMax)*38}" r="2" fill="var(--accent)" vector-effect="non-scaling-stroke"/>`).join('')}
            </svg>
          </div>
          <div style="display:flex;justify-content:space-between;font-size:11px;font-family:var(--mono);color:var(--dim);margin-top:2px">
            <span>oldest</span><span>most recent</span>
          </div>
        </div>
      </div>
    </div>

    <!-- GLUCOSE SECTION -->
    ${withBoth.length > 0 ? `
    <div class="stats-section" style="margin-top:18px">
      <div class="sec-ttl">Glucose response (${withBoth.length} meals)</div>
      <div class="glu-band" style="margin-bottom:10px">
        <div class="glu-band-row">
          <span class="glu-band-lbl">Pre-meal</span>
          <div class="glu-band-track">
            <div class="glu-band-fill" style="width:${Math.min(avgPre/300*100,100)}%;background:${avgPre<100?'var(--accent)':avgPre<140?'var(--warn)':'var(--danger)'}"></div>
          </div>
          <span class="glu-band-val" style="color:${avgPre<100?'var(--accent)':avgPre<140?'var(--warn)':'var(--danger)'}">${avgPre}</span>
        </div>
        <div class="glu-band-row">
          <span class="glu-band-lbl">Post-meal</span>
          <div class="glu-band-track">
            <div class="glu-band-fill" style="width:${Math.min(avgPost/300*100,100)}%;background:${avgPost<140?'var(--accent)':avgPost<180?'var(--warn)':'var(--danger)'}"></div>
          </div>
          <span class="glu-band-val" style="color:${avgPost<140?'var(--accent)':avgPost<180?'var(--warn)':'var(--danger)'}">${avgPost}</span>
        </div>
        <div class="glu-band-row">
          <span class="glu-band-lbl">Rise</span>
          <div class="glu-band-track">
            <div class="glu-band-fill" style="width:${Math.min(Math.max(avgRise,0)/100*100,100)}%;background:${avgRise<=30?'var(--accent)':avgRise<=60?'var(--warn)':'var(--danger)'}"></div>
          </div>
          <span class="glu-band-val" style="color:${avgRise<=30?'var(--accent)':avgRise<=60?'var(--warn)':'var(--danger)'}">+${Math.max(0,avgRise)}</span>
        </div>
      </div>
      <div class="stat-grid">
        <div class="stat-card ${wellPct>=70?'gd':wellPct>=50?'':'wa'}">

          <span class="stat-sub">Rise ≤30 mg/dL</span>

          <span class="stat-v">${withBoth.filter(m=>(m.postGlucose.value-m.preGlucose.value)>60).length}</span>
          <span class="stat-l">High spikes</span>
          <span class="stat-sub">Rise >60 mg/dL</span>
        </div>
        ${lowCount > 0 ? `
        <div class="stat-card wa">
          <span class="stat-v">${lowCount}</span>
          <span class="stat-l">Post-meal lows</span>
          <span class="stat-sub">Below 70 mg/dL</span>
        </div>` : ''}
      </div>
    </div>` : `
    <div class="stats-section" style="margin-top:18px">
      <div class="sec-ttl">Glucose response</div>
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;text-align:center">

        <div style="font-size:11px;font-family:var(--mono);color:var(--muted);line-height:1.5">Add pre and post-meal glucose readings in your history cards to unlock glucose response tracking and improve your ICR accuracy.</div>
      </div>
    </div>`}

    <!-- SPLIT DOSE & GI -->
    <div class="stats-section" style="margin-top:18px">
      <div class="sec-ttl">Meal characteristics</div>
      <div class="stat-grid" style="margin-bottom:12px">
        <div class="stat-card ${splitPct>40?'wa':''}">
          <span class="stat-v">${splitPct}%</span>

          <span class="stat-l">Highest carb meal</span>

        </div>
      </div>
      <div class="gap-3">
        <div class="sec-ttl" style="margin-bottom:8px">Glycaemic index spread</div>
        ${['low','medium','high'].map(level => `
        <div class="gi-row">
          <span class="gi-nm ${level}">${level.charAt(0).toUpperCase()+level.slice(1)}</span>

        </div>`).join('')}

    </div>

    <div style="height:24px"></div>
  </div>`
}

// ── EVENTS ────────────────────────────────────────────────────
function attachEvents() {
  const desc = document.getElementById('mealDesc')
  if (desc) desc.addEventListener('input', e => { state.log.description = e.target.value; updateAnalyzeBtn() })
  const refineInp = document.getElementById('refineInput')
  if (refineInp) refineInp.addEventListener('input', e => { state.log.refineContext = e.target.value })

  const clarFields = document.querySelectorAll('[id^="clar_"]')
  clarFields.forEach(f => {
    f.addEventListener('input', e => {
      const id = e.target.id.replace('clar_', '')
      state.log.clarAnswers[id] = e.target.value
      // Update the Continue button WITHOUT re-rendering (keeps keyboard/focus)
      updateClarifyBtn()
    })
  })
}

function updateClarifyBtn() {
  const L = state.log
  if (!L.clarification) return
  const btn = document.getElementById('clarifyContinueBtn')
  if (!btn) return
  const allAnswered = L.clarification.questions.every(q => {
    const v = L.clarAnswers[q.id]
    return v !== undefined && String(v).trim() !== ''
  })
  btn.disabled = !allAnswered || L.loading
}

function updateAnalyzeBtn() {
  const btn = document.getElementById('analyzeBtn')
  if (btn) btn.disabled = (!state.log.description.trim() && !state.log.imageB64) || state.log.loading
}

function handleFile(input) {
  const file = input.files[0]
  if (!file) return
  const reader = new FileReader()
  reader.onload = async e => {
    const raw = e.target.result.split(',')[1]
    const mime = file.type || 'image/jpeg'
    // Compress immediately on load — keeps stored image small too
    state.log.imageB64 = await compressImage(raw, mime)
    state.log.imageMime = 'image/jpeg'
    render()
  }
  reader.readAsDataURL(file)
}

function handleDrop(e) {
  e.preventDefault()
  const file = e.dataTransfer.files[0]
  if (!file) return
  const reader = new FileReader()
  reader.onload = async ev => {
    const raw = ev.target.result.split(',')[1]
    const mime = file.type || 'image/jpeg'
    state.log.imageB64 = await compressImage(raw, mime)
    state.log.imageMime = 'image/jpeg'
    render()
  }
  reader.readAsDataURL(file)
}

function clearImage() {
  state.log.imageB64 = null
  render()
}

function setClarAnswer(id, val) {
  state.log.clarAnswers[id] = val
  render()
}

// Choice answers are referenced by index to avoid injecting AI text into inline handlers.
function setClarChoice(id, idx) {
  // Preserve any text typed into other clarify inputs before re-render
  document.querySelectorAll('[id^="clar_"]').forEach(f => {
    const qid = f.id.replace('clar_', '')
    if (f.value) state.log.clarAnswers[qid] = f.value
  })
  const q = state.log.clarification && state.log.clarification.questions.find(x => x.id === id)
  if (!q || !q.options) return
  state.log.clarAnswers[id] = q.options[idx]
  render()
}

function submitClarify() {
  const L = state.log
  const allAnswered = L.clarification.questions.every(q => L.clarAnswers[q.id])
  if (!allAnswered) return
  doAnalyze(L.clarAnswers)
}

function submitPostGlucose() {
  const val = parseFloat(document.getElementById('postGluVal')?.value)
  if (!isNaN(val) && val > 0) doPostGlucose(val)
}

function showPost() { state.log.showPostInput = true; render() }
function hidePost() { state.log.showPostInput = false; render() }

function toggleHistory(id) {
  const meal = state.meals.find(m => m.id === id)
  if (meal) { meal._expanded = !meal._expanded; render() }
}

function editHistoryGluco(id, type) {
  const meal = state.meals.find(m => m.id === id)
  if (!meal) return
  if (type === 'pre') meal._editingPre = true
  else meal._editingPost = true
  render()
}

function cancelHistoryGluco(id, type) {
  const meal = state.meals.find(m => m.id === id)
  if (!meal) return
  if (type === 'pre') meal._editingPre = false
  else meal._editingPost = false
  render()
}

function saveHistoryGluco(id, type, inputId) {
  const meal = state.meals.find(m => m.id === id)
  if (!meal) return
  const inp = document.getElementById(inputId)
  const val = inp ? parseFloat(inp.value) : NaN
  if (isNaN(val) || val < 40 || val > 600) {
    if (inp) { inp.style.borderColor = 'var(--danger)'; inp.focus() }
    return
  }
  const reading = { value: val, ts: new Date().toISOString() }
  if (type === 'pre') {
    meal.preGlucose = reading
    meal._editingPre = false
  } else {
    meal.postGlucose = reading
    meal._editingPost = false
  }
  // Recalculate effective ICR if we now have both readings
  if (meal.preGlucose && meal.postGlucose && meal.dose) {
    const rise = meal.postGlucose.value - meal.preGlucose.value
    const insulinGiven = meal.dose.total
    const carbs = meal.nutrition.carbs
    if (rise > 0 && insulinGiven > 0 && carbs > 0) {
      meal.effectiveICR = Math.round((carbs / insulinGiven) * (1 / (1 + rise / 100)) * 10) / 10
    } else {
      meal.effectiveICR = null
    }
  }
  save()
  render()
}

function clearHistoryGluco(id, type) {
  const meal = state.meals.find(m => m.id === id)
  if (!meal) return
  if (type === 'pre') { meal.preGlucose = null; meal._editingPre = false }
  else { meal.postGlucose = null; meal._editingPost = false }
  meal.effectiveICR = null
  save()
  render()
}

function saveICR() {
  const val = parseFloat(document.getElementById('icrInput')?.value)
  if (isNaN(val) || val <= 0) return
  state.settings.icr = val
  save()
  document.getElementById('icrDisplay').textContent = val
  const btn = document.getElementById('saveIcrBtn')
  if (btn) { btn.textContent = '✓ Saved'; setTimeout(() => { btn.textContent = 'Save ICR' }, 2000) }
}

function saveGeminiKey() {
  const inp = document.getElementById('geminiKeyInput')
  if (!inp) return
  const key = inp.value.trim()
  if (!key) { localStorage.removeItem('cl_gemini_key'); render(); return }
  localStorage.setItem('cl_gemini_key', key)
  const btn = document.getElementById('saveGeminiBtn')
  if (btn) { btn.textContent = '✓ Saved'; setTimeout(() => { btn.textContent = 'Save Key'; render() }, 1500) }
  render()
}

function saveGeminiModel() {
  const inp = document.getElementById('geminiModelInput')
  if (!inp) return
  const v = inp.value.trim()
  if (v) localStorage.setItem('cl_gemini_model', v)
  else localStorage.removeItem('cl_gemini_model')
  const btn = document.getElementById('saveModelBtn')
  if (btn) { btn.textContent = '✓ Saved'; setTimeout(() => { btn.textContent = 'Save Model' }, 1500) }
}

function saveMaxBolus() {
  const val = parseFloat(document.getElementById('maxBolusInput')?.value)
  if (isNaN(val) || val < 1) { notify('Enter a max bolus of at least 1 unit.', 'err'); return }
  state.settings.maxBolus = Math.min(100, val)
  save()
  const btn = document.getElementById('saveMaxBolusBtn')
  if (btn) { btn.textContent = '✓ Saved'; setTimeout(() => { btn.textContent = 'Save' }, 2000) }
}


// ── GLUCOSE INPUT ────────────────────────────────────────────
function setCurrentGlucose(val) {
  const num = parseFloat(val)
  state.log.currentGlucose = isNaN(num) || num <= 0 ? null : num
  // Re-render just the strip area without full render for responsiveness
  const strip = document.querySelector('.lgs-right')
  if (strip) {
    const correction = state.log.currentGlucose ? Math.round(calcCorrectionDose(state.log.currentGlucose)) : 0
    strip.innerHTML = `
      ${correction > 0 ? `<div class="lgs-corr"><span class="lgs-corr-val">+${correction}u</span><span class="lgs-corr-lbl">correction</span></div>` : ''}
      ${correction < 0 ? `<div class="lgs-corr"><span class="lgs-corr-val" style="color:var(--split)">${correction}u</span><span class="lgs-corr-lbl">reduction</span></div>` : ''}
      ${state.log.currentGlucose && state.log.currentGlucose < 70 ? `<div class="lgs-alert">⚠ Low — treat first</div>` : ''}
    `
  }
}

// ── FAVOURITES ────────────────────────────────────────────────
function saveAsFavourite() {
  const L = state.log
  if (!L.nutrition) return
  const fav = {
    id: crypto.randomUUID(),
    name: L.nutrition.mealDescription,
    description: L.description || L.nutrition.mealDescription,
    nutrition: L.nutrition,
    dose: L.dose,
    savedAt: new Date().toISOString()
  }
  state.favourites.unshift(fav)
  if (state.favourites.length > 20) state.favourites = state.favourites.slice(0, 20)
  save()
  render()
}

function useFavourite(favId) {
  const fav = state.favourites.find(f => f.id === favId)
  if (!fav) return
  state.log.description = fav.description
  state.log.nutrition = { ...fav.nutrition }
  state.log.dose = calcDose(fav.nutrition.carbs, state.settings.icr, fav.nutrition.isSplit, state.log.currentGlucose)
  const mealId = crypto.randomUUID()
  state.log.currentMealId = mealId
  const meal = {
    id: mealId, timestamp: new Date().toISOString(),

    nutrition: state.log.nutrition,
    dose: state.log.dose,

  }
  state.meals.unshift(meal)
  save()

}

async function generateNarrative() {
  if (state.meals.length < 3) { notify('Log at least 3 meals to generate insights.'); return }
  state.narrative.loading = true
  render()
  try {
    const summary = state.meals.slice(0, 30).map(m => ({
      meal: m.nutrition.mealDescription,
      carbs: m.nutrition.carbs,
      fat: m.nutrition.fat,
      dose: m.dose.total,
      split: m.dose.split,
      gi: m.nutrition.glycemicIndex,
      preGlu: m.preGlucose?.value,
      postGlu: m.postGlucose?.value,
      rise: m.preGlucose && m.postGlucose ? m.postGlucose.value - m.preGlucose.value : null,
      time: new Date(m.timestamp).getHours()
    }))
    const prompt = `You are a diabetes clinical nutritionist reviewing a Type 1 diabetic's meal logs. Analyse these ${summary.length} meals and write a concise, practical 3–4 paragraph narrative report covering: (1) eating patterns and carb distribution, (2) glucose response trends if data available, (3) split dose frequency and whether it seems appropriate, (4) one specific actionable recommendation. Write in plain English, be direct, be specific with numbers. DO NOT use bullet points or headers. Meal data: ${JSON.stringify(summary)}`
    const text = await callGemini([{ text: prompt }])
    state.narrative = { text, loading: false, generatedAt: new Date().toISOString() }
    save()
  } catch(e) {
    state.narrative.loading = false
    notify('Could not generate insights: ' + e.message, 'err')
  }
  render()
}

// ── RESTORE BACKUP ────────────────────────────────────────────
function restoreBackup(input) {
  const file = input.files[0]
  if (!file) return
  const reader = new FileReader()
  reader.onload = e => {
    try {
      const d = JSON.parse(e.target.result)
      if (!d.meals || !Array.isArray(d.meals)) throw new Error('Invalid backup file')
      if (!confirm(`Restore ${d.meals.length} meals from backup? This will merge with your existing ${state.meals.length} meals.`)) return
      // Merge — deduplicate by id. Backups omit photo data, so drop any
      // placeholder image payload and clear the hasImage flag on restored meals.
      const existing = new Set(state.meals.map(m => m.id))
      const newMeals = d.meals.filter(m => !existing.has(m.id)).map(m => {
        const cleaned = { ...m, _imgSaved: false }
        if (typeof cleaned.imageB64 !== 'string' || !cleaned.imageB64.match(/^[A-Za-z0-9+/=]+$/) || cleaned.imageB64.length < 100) {
          cleaned.imageB64 = null; cleaned.hasImage = false
        }
        return cleaned
      })
      state.meals = [...state.meals, ...newMeals].sort((a,b) => new Date(b.timestamp)-new Date(a.timestamp))
      if (d.settings) state.settings = { ...state.settings, ...d.settings }
      if (d.favourites) {
        const favIds = new Set((state.favourites||[]).map(f => f.id))
        state.favourites = [...(state.favourites||[]), ...(d.favourites||[]).filter(f => !favIds.has(f.id))]
      }
      if (d.narrative && d.narrative.text && !state.narrative.text) state.narrative = d.narrative
      // Restore device config — never overwrite an existing key with a backup's
      const restored = []
      if (d.config) {
        if (d.config.geminiApiKey && !localStorage.getItem('cl_gemini_key')) {
          localStorage.setItem('cl_gemini_key', d.config.geminiApiKey); restored.push('Gemini key')
        }
        if (d.config.googleClientId && !localStorage.getItem('cl_google_client_id')) {
          localStorage.setItem('cl_google_client_id', d.config.googleClientId); restored.push('Google Client ID')
        }
        if (d.config.geminiModel && !localStorage.getItem('cl_gemini_model')) {
          localStorage.setItem('cl_gemini_model', d.config.geminiModel); restored.push('model')
        }
        if (d.config.theme) { localStorage.setItem('cl_theme', d.config.theme); applyTheme(); restored.push('theme') }
      }
      save()
      render()
      notify(`✓ Restored ${newMeals.length} new meals${restored.length ? ' + ' + restored.join(' + ') : ''}.`, 'ok')
    } catch(err) {
      notify('Could not restore backup: ' + err.message, 'err')
    }
  }
  reader.readAsText(file)
}

// ── SPEECH TO TEXT ───────────────────────────────────────────
let _sttRecognition = null
let _sttListening = false

function toggleSpeech() {
  if (_sttListening) {
    stopSpeech()
    return
  }
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition
  if (!SpeechRecognition) {
    notify('Speech recognition is not supported in this browser. Try Chrome on Android.', 'err')
    return
  }
  const r = new SpeechRecognition()
  r.continuous = false
  r.interimResults = true
  r.lang = 'en-GB'

  const btn = document.getElementById('sttBtn')
  const icon = document.getElementById('sttIcon')
  const ta = document.getElementById('mealDesc')
  const baseText = state.log.description

  r.onstart = () => {
    _sttListening = true
    if (btn) btn.classList.add('listening')
    if (icon) icon.innerHTML = ICONS.stop
  }

  r.onresult = (e) => {
    const transcript = Array.from(e.results).map(r => r[0].transcript).join('')
    const newText = baseText ? baseText + ' ' + transcript : transcript
    if (ta) ta.value = newText
    state.log.description = newText
    updateAnalyzeBtn()
  }

  r.onerror = (e) => {
    stopSpeech()
    if (e.error !== 'no-speech') alert('Microphone error: ' + e.error)
  }

  r.onend = () => { stopSpeech() }

  _sttRecognition = r
  r.start()
}

function stopSpeech() {
  _sttListening = false
  if (_sttRecognition) { try { _sttRecognition.stop() } catch(e) { console.warn('speech stop failed', e) } _sttRecognition = null }
  const btn = document.getElementById('sttBtn')
  const icon = document.getElementById('sttIcon')
  if (btn) btn.classList.remove('listening')
  if (icon) icon.innerHTML = ICONS.mic
  // Finalise state from textarea value
  const ta = document.getElementById('mealDesc')
  if (ta) { state.log.description = ta.value; updateAnalyzeBtn() }
}

// ── SIMILAR MEAL LOOKUP ──────────────────────────────────────
function tokenize(s) {
  return new Set((s||'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(w => w.length > 3))
}

function findSimilarMeal(description, excludeId) {
  const q = tokenize(description)
  if (q.size < 1) return null
  let best = null, bestScore = 0
  for (const m of state.meals) {
    if (m.id === excludeId) continue
    const t = tokenize(m.description || m.nutrition?.mealDescription)
    if (!t.size) continue
    let overlap = 0
    q.forEach(w => { if (t.has(w)) overlap++ })
    const score = overlap / Math.max(q.size, t.size)
    if (score > bestScore) { bestScore = score; best = m }
  }
  return bestScore >= 0.4 ? best : null
}

// ── REMINDERS: SPLIT-DOSE TIMER + POST-MEAL NUDGE ────────────
const NUDGE_AFTER_MIN = 120   // ask for post-meal reading 2h after logging
const NUDGE_EXPIRE_MIN = 360  // stop asking after 6h

function activeSplit() {
  // Most recent split meal whose second dose is not yet taken, within 4h
  const cutoff = Date.now() - 4 * 60 * 60 * 1000
  return state.meals.find(m => m.splitDueAt && !m.splitTaken && new Date(m.timestamp).getTime() > cutoff) || null
}

function pendingNudges() {
  const now = Date.now()
  return state.meals.filter(m => {
    if (m.postGlucose || m.nudgeDismissed) return false
    const age = (now - new Date(m.timestamp).getTime()) / 60000
    return age >= NUDGE_AFTER_MIN && age <= NUDGE_EXPIRE_MIN
  })
}

function fmtCountdown(ms) {
  if (ms <= 0) return 'now'
  const m = Math.floor(ms / 60000), s = Math.floor((ms % 60000) / 1000)
  return m > 0 ? `${m}m ${String(s).padStart(2,'0')}s` : `${s}s`
}

function markSplitTaken(id) {
  const meal = state.meals.find(m => m.id === id)
  if (meal) { meal.splitTaken = true; save(); render(); notify('Second dose marked as taken ✓', 'ok') }
}

function dismissNudge(id) {
  const meal = state.meals.find(m => m.id === id)
  if (meal) { meal.nudgeDismissed = true; save(); render() }
}

function openMealForPost(id) {
  state.page = 'history'
  state.meals.forEach(m => { m._expanded = m.id === id })
  const meal = state.meals.find(m => m.id === id)
  if (meal) meal._editingPost = true
  nav('history')
}

function requestNotifPermission() {
  if (!('Notification' in window)) return
  if (Notification.permission === 'default') Notification.requestPermission()
}

function fireNotification(title, body) {
  if (!('Notification' in window) || Notification.permission !== 'granted') return
  try { new Notification(title, { body, icon: document.getElementById('appIcon')?.href, tag: title }) } catch(e) {}
}

// Tick every 20s: fire due notifications + refresh countdown text in place
setInterval(() => {
  const sp = activeSplit()
  if (sp) {
    const due = new Date(sp.splitDueAt).getTime()
    if (Date.now() >= due && !sp.splitNotified) {
      sp.splitNotified = true; save()
      fireNotification('CarbLens — second dose due', `Take the remaining ${sp.dose.later}u for "${(sp.description||'your meal').slice(0,40)}"`)
      if (state.page === 'log') render()
    }
    const el = document.getElementById('splitTimerVal')
    if (el) el.textContent = Date.now() >= due ? 'due now' : fmtCountdown(due - Date.now())
  }
  pendingNudges().forEach(m => {
    if (!m.nudgeNotified) {
      m.nudgeNotified = true; save()
      fireNotification('CarbLens — glucose check', 'How did that meal go? Log your post-meal reading.')
      if (state.page === 'log') render()
    }
  })
}, 20000)

// ── THEME ────────────────────────────────────────────────────
function applyTheme() {
  const pref = localStorage.getItem('cl_theme') || 'dark'
  let mode = pref
  if (pref === 'auto') {
    mode = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
  }
  document.documentElement.setAttribute('data-theme', mode)
  const meta = document.querySelector('meta[name="theme-color"]')
  if (meta) meta.content = mode === 'light' ? '#f4f7f4' : '#09100d'
  const moon = document.getElementById('themeIconMoon')
  const sun = document.getElementById('themeIconSun')
  if (moon && sun) {
    moon.style.display = mode === 'light' ? '' : 'none'
    sun.style.display = mode === 'light' ? 'none' : ''
  }
}
function setTheme(pref) {
  localStorage.setItem('cl_theme', pref)
  applyTheme()
  render()
}
function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme') || 'dark'
  setTheme(current === 'dark' ? 'light' : 'dark')
}
window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => {
  if ((localStorage.getItem('cl_theme') || 'dark') === 'auto') applyTheme()
})
applyTheme()

window.addEventListener('load', () => { setTimeout(showiOSHint, 1500); });
// Flush any pending debounced save when app is backgrounded or closed
document.addEventListener('visibilitychange', () => { if (document.hidden) { clearTimeout(_saveTimer); _saveNow() } });
window.addEventListener('pagehide', () => { clearTimeout(_saveTimer); _saveNow() });
</script>
</body>
